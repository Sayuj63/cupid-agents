{% extends "base.html" %}
{% block body %}
<div class="card p-8 text-center"><h1 class="display text-2xl font-bold">{{ p.name or p.id }}</h1>
<p class="mt-2 text-stone-600">This agent is still being created (status: <b>{{ p.status }}</b>).{% if p.error %}<br><span class="text-rose-600">{{ p.error }}</span>{% endif %}</p>
<p class="mt-4 text-sm text-stone-500">Refresh in a minute.</p></div>
{% endblock %}
